<style>
:root{
  --bg:#05051f; --bg2:#0b0b2e; --card:#11113a; --card2:#181850; --line:#26266e;
  --txt:#f4f2ff; --txt2:#a9a8d8; --txt3:#7a79b0;
  --indigo:#4a47c4; --peri:#8b8cf2; --lilas:#cfa3fa; --neon:#5cff1a; --neon-txt:#062b00;
  --falta:#ff7aa8; --falta-bg:#3a1030; --just:#ffc861; --just-bg:#3a2a08;
  --grad:linear-gradient(135deg,#4a47c4 0%,#8b8cf2 55%,#cfa3fa 100%);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.gotico{font-family:'Pirata One',serif;font-weight:400;letter-spacing:.5px}
.grad-txt{background:linear-gradient(180deg,#a5a6ff,#cfa3fa);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top{position:sticky;top:0;z-index:20;background:rgba(5,5,31,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #15154a}
header.top img{height:34px}
header.top .tt{font-size:28px;line-height:1}
header.top .sp{flex:1}
.icobtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.sync{font-size:12px;color:var(--txt3)}
.sync.pend{color:var(--just)}
main{padding:14px 16px calc(40px + var(--safe-b));max-width:720px;margin:0 auto}
main.entra{animation:entra .28s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.voltar{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--lilas);font-size:17px;padding:6px 4px 6px 0;cursor:pointer;margin-left:-6px}
.voltar svg{width:26px;height:26px}
.home{min-height:100vh;padding:calc(var(--safe-t) + 34px) 20px calc(28px + var(--safe-b));max-width:560px;margin:0 auto;display:flex;flex-direction:column;animation:fade .35s}
.home .logo{display:flex;justify-content:center;margin:4px 0 18px}
.home .logo img{width:132px;filter:drop-shadow(0 0 18px rgba(165,166,255,.35))}
.home .ola{text-align:center;font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0}
.home .data{text-align:center;color:var(--txt2);font-size:15px;margin:4px 0 26px}
.agora{display:flex;align-items:center;gap:14px;background:var(--grad);border-radius:22px;padding:16px 18px;color:#fff;cursor:pointer;margin-bottom:14px;transition:transform .12s}
.agora:active,.tile:active{transform:scale(.97)}
.agora .k{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.agora .t{font-size:20px;font-weight:600;margin-top:2px}
.agora .s{font-size:14px;opacity:.9}
.agora svg{margin-left:auto;opacity:.9}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid #1f1f5e;border-radius:22px;padding:16px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .12s;text-align:left;color:inherit}
.tile .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff}
.tile .ico svg{width:24px;height:24px}
.tile .nm{font-size:17px;font-weight:600;margin-top:14px;letter-spacing:-.01em}
.tile .sb{font-size:13px;color:var(--txt2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.larga{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:0}
.tile.larga .nm{margin-top:0}
a.btn{color:inherit;text-decoration:none}
.av-i{display:inline-flex;vertical-align:-3px;margin-left:6px}
.avs{display:flex;gap:2px;flex:none;margin-right:-2px}
.avs .av-i{margin-left:0}
.av-i.s{color:var(--just)} .av-i.f{color:var(--falta)}
.anivs{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid #1f1f5e;border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.anivs .bolo{font-size:22px}
.atencao{display:flex;align-items:center;gap:10px;background:var(--just-bg);border:1px solid #5a4410;color:var(--just);border-radius:14px;padding:10px 14px;margin:12px 0 0;cursor:pointer;font-size:14px}
.ev{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer}
.ev .dt{width:54px;flex:none;text-align:center;border-radius:14px;background:var(--card2);padding:6px 0}
.ev .dt b{display:block;font-family:'Pirata One',serif;font-weight:400;font-size:26px;line-height:1}
.ev .dt span{font-size:11px;color:var(--lilas);text-transform:uppercase;letter-spacing:.06em}
.ev .in2{flex:1;min-width:0}
.ev .nm{font-weight:600;font-size:16px}
.ev .sb{font-size:13px;color:var(--txt2)}
.ev .bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.home .rodape{margin-top:auto;padding-top:28px;display:flex;justify-content:center;gap:16px;align-items:center}
.home .rodape button{background:none;border:0;color:var(--txt3);font-size:14px;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,8,36,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #1d1d5a;display:flex;padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;background:none;border:0;color:var(--txt3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--lilas)}
nav.tabs button.on svg{stroke:var(--lilas)}
h2.sec{font-family:'Pirata One',serif;font-weight:400;font-size:30px;margin:6px 2px 10px;line-height:1.1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin:20px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.hero{background:var(--grad);border-radius:20px;padding:16px 18px;color:#fff;position:relative;overflow:hidden}
.hero .k{font-size:12px;opacity:.85}
.hero .nm{font-family:'Pirata One',serif;font-size:34px;line-height:1.05;margin:2px 0}
.hero .sub{font-size:14px;opacity:.92}
.hero .tag{position:absolute;top:12px;right:12px;background:rgba(5,5,31,.35);border-radius:999px;padding:3px 10px;font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.muted{color:var(--txt2)}
.small{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:11px 18px;font-weight:500;cursor:pointer;min-height:46px}
.btn.pri{background:var(--grad);border:0;color:#fff}
.btn.neon{background:transparent;border:1.5px solid var(--neon);color:var(--neon)}
.btn.wa{background:#1f8f4e;border:0;color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--falta);border-color:#5a2040}
.btn:disabled{opacity:.5}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .d{flex:1;text-align:center;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.al{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;min-height:60px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s}
.al:active{transform:scale(.985)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--card2);color:var(--lilas);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:24px}
.al .nm{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al .nm small{display:block;color:var(--txt3);font-size:12px}
.st{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;min-width:92px;text-align:center;flex:none}
.st.n{background:#18184a;color:var(--txt3)}
.al.p{border-color:var(--neon)} .st.p{background:var(--neon);color:var(--neon-txt)}
.al.f{border-color:#5a2040} .st.f{background:var(--falta-bg);color:var(--falta)}
.al.j{border-color:#5a4410} .st.j{background:var(--just-bg);color:var(--just)}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--txt2);white-space:nowrap}
.badge.ok{background:#11361a;color:var(--neon)}
.badge.bad{background:var(--falta-bg);color:var(--falta)}
.badge.warn{background:var(--just-bg);color:var(--just)}
.badge.rep{background:#2a1a50;color:var(--lilas)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-family:'Pirata One',serif;font-weight:400}
.stat span{font-size:11px;color:var(--txt3)}
.empty{text-align:center;padding:28px 16px;color:var(--txt2)}
.empty .gotico{font-size:26px;color:var(--txt)}
input.in,select.in,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--peri)}
label.lb{display:block;font-size:13px;color:var(--txt2);margin:12px 2px 6px}
.search{position:relative;margin-bottom:10px}
.cover{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer}
.cover .mu{font-family:'Pirata One',serif;font-size:26px;line-height:1.1}
.cover .gr{color:var(--lilas);font-weight:500}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.yt{display:inline-flex;align-items:center;gap:6px;background:#2a0d18;color:#ff8aa0;border:1px solid #5a1d30;border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none}
.cal-day{margin-top:14px}
.cal-day .dt{font-weight:600;margin:0 4px 6px;font-size:14px;color:var(--txt2)}
.aula{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;margin-bottom:6px}
.aula.cancel{opacity:.55;text-decoration:line-through}
.aula .h{font-weight:600;min-width:96px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,10,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:8px 18px calc(22px + var(--safe-b));animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#33337a;margin:4px auto 10px}
.sheet-top{position:sticky;top:-8px;z-index:2;margin:-8px -18px 0;padding:8px 18px 2px;background:var(--bg2);touch-action:none}
.fechar-x{position:absolute;right:14px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--txt2);display:grid;place-items:center;cursor:pointer}
.sheet h4{font-family:'Pirata One',serif;font-weight:400;font-size:28px;margin:0 0 4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-top:8px}
.kv dt{color:var(--txt3)} .kv dd{margin:0;word-break:break-word}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%);background:#1d1d5a;border:1px solid var(--peri);color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:14px;max-width:90vw;text-align:center;animation:fade .2s}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;background:radial-gradient(ellipse at center,#0a0a40 0%,#05051f 65%)}
.login img{width:200px;max-width:60vw;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.login form{width:100%;max-width:360px;margin-top:26px}
.err{color:var(--falta);font-size:14px;margin-top:10px;text-align:center}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;background:none;border:0;border-radius:999px;padding:8px 6px;font-size:14px;cursor:pointer;color:var(--txt2)}
.seg button.on{background:var(--card2);color:#fff}
.pay{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.pay .v{text-align:right;font-size:14px}
.pos{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pos .n{flex:1;font-size:15px}
.pos input{flex:1.2}
.spin{width:28px;height:28px;border:3px solid #26266e;border-top-color:var(--lilas);border-radius:50%;animation:rot 1s linear infinite;margin:40px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.demo{background:#2a1a50;color:var(--lilas);font-size:12px;text-align:center;padding:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   ICY Academy · app interna
   ========================================================= */
const API = (window.ICY_API || '').trim();
const DEMO = !API || /[?&]demo/.test(location.search);
const LOGO = 'logo-branco.png';
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_C = ['dom','seg','ter','qua','qui','sex','sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ESTADOS = {'':'n','Presente':'p','Falta':'f','Justificada':'j'};
const ROTULO = {'':'Por marcar','Presente':'Presente','Falta':'Falta','Justificada':'Justificada'};
const CICLO = {'':'Presente','Presente':'Falta','Falta':'Justificada','Justificada':''};

const S = {
  token: ls('icy_token'), eu: lsj('icy_eu'), d: normAlunos(lsj('icy_dados')),
  view: 'home', dia: hoje(), aulaSel: null, filtroAl: 'todos', busca: '',
  mesCal: hoje().slice(0,7), calDraft: null, calDirty: false, mesPag: hoje().slice(0,7), pagTab: ls('icy_pagTab')||'alunas',
  fila: lsj('icy_fila') || [], aSincronizar: false, fotos: lsj('icy_fotos') || {}, offline: ls('icy_offline')==='1'
};

/* ---------- utilidades ---------- */
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsj(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return iso(new Date())}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDias(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function addMes(m,n){let [y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+pad(mm)}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function diaPT(s){const d=parse(s);return DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]}
function diaCurto(s){const d=parse(s);return DIAS_C[d.getDay()]+' '+d.getDate()+'/'+pad(d.getMonth()+1)}
function mesPT(m){const [y,mm]=m.split('-').map(Number);return cap(MESES[mm-1])+' '+y}
function eur(v){return (Number(v)||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function iniciais(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function nascP(n){const m=String(n||'').match(/^(\d{4}|-)?-(\d{2})-(\d{2})/);return m?{y:m[1]&&m[1]!=='-'?m[1]:'',m:m[2],d:m[3]}:null}
function nascTxt(n){const p=nascP(n);return p?p.d+'/'+p.m+(p.y?'/'+p.y:''):''}
function idade(n){const p=nascP(n);if(!p||!p.y)return null;const b=parse(n),h=new Date();let a=h.getFullYear()-b.getFullYear();if(h.getMonth()<b.getMonth()||(h.getMonth()===b.getMonth()&&h.getDate()<b.getDate()))a--;return a}
function tel(n){let d=String(n||'').replace(/\D/g,'');if(d.length===9)d='351'+d;if(d.startsWith('00'))d=d.slice(2);return d}
function wa(numero,texto){const t=encodeURIComponent(texto);const n=numero?tel(numero):'';const url=n?`https://wa.me/${n}?text=${t}`:`https://wa.me/?text=${t}`;
  if(n&&!DEMO){location.href=url;return}
  S._msg=texto;
  abrirSheet(`<h4>Mensagem pronta</h4><p class="small muted">Copiem o texto para colar no chat que quiserem dentro da comunidade, ou abram diretamente no WhatsApp.</p><div class="card" style="white-space:pre-wrap;font-size:15px;max-height:42vh;overflow:auto">${esc(texto)}</div>
  <div class="list" style="margin-top:12px"><button class="btn pri full" data-a="copiarMsg">${ic('copiar',18)} Copiar texto</button><a class="btn wa full" href="${esc(url)}" target="_blank" rel="noopener">${ic('wa',18)} Abrir no WhatsApp</a></div>`)}
async function copiarTexto(t){
  try{ await navigator.clipboard.writeText(t); return true }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='absolute'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); const ok=document.execCommand('copy'); ta.remove(); return ok }catch(e){ return false }
}
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function gestao(){return S.eu&&S.eu.perfil==='Gestão'}
function turma(id){return (S.d.turmas||[]).find(t=>t.id===id)||{id,nome:id}}
function aluno(id){return (S.d.alunos||[]).find(a=>a.id===id)||{id,nome:'(aluno '+id+')'}}
function minhasTurmas(){const ts=(S.d.turmas||[]).filter(t=>t.ativa);return gestao()?ts:ts.filter(t=>String(t.professor).toLowerCase()===S.eu.email)}
function alunosDaTurma(tid){const ids=new Set(S.d.inscricoes.filter(i=>i.turma===tid&&i.ativa).map(i=>i.aluno));return S.d.alunos.filter(a=>a.ativo&&ids.has(a.id)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'))}
function turmasDoAluno(aid){return S.d.inscricoes.filter(i=>i.aluno===aid&&i.ativa)}
function idFicheiro(u){const m=String(u||'').match(/[-\w]{25,}/);return m?'f_'+m[0]:''}
function fotoSrc(a){const k=idFicheiro(a.foto);if(k&&S.fotos[k])return S.fotos[k];if(a.foto&&/^https?:/.test(a.foto)&&!/drive\.google|docs\.google/.test(a.foto))return a.foto;return ''}
function avisos(a){let h='';if(a.notas&&String(a.notas).trim())h+=`<span class="av-i s" title="Notas de saúde">${ic('saude',16)}</span>`;if(a.imagem==='Não')h+=`<span class="av-i f" title="Sem autorização de imagem">${ic('semfoto',16)}</span>`;return h}
function avatar(a,grande){const src=fotoSrc(a);return `<div class="av${grande?' big':''}">${src?`<img src="${esc(src)}" alt="">`:esc(iniciais(a.nome))}</div>`}
const IC = {
  hoje:'<path d="M9 11l3 3 7-7"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  alunos:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.6 3.4-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6-.2 4.8 1.4 5.5 4.4"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  covers:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  pag:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
  menu:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  play:'<path d="M7 4.5v15l12.5-7.5z"/>', mirror:'<path d="M12 3v18M8 7l-4 5 4 5M16 7l4 5-4 5"/>',
  wa:'<path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.6z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>',
  phone:'<path d="M5 3.5h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.6 6.6l1.4-2.3 4.5 1.8V19a2 2 0 0 1-2.2 2A17 17 0 0 1 3 5.7 2 2 0 0 1 5 3.5z"/>',
  trofeu:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  saude:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/>',
  semfoto:'<path d="M3 3l18 18"/><path d="M9.5 5h5l2 2H19a2 2 0 0 1 2 2v8.5M17 19H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1"/><circle cx="12" cy="13" r="3"/>',
  copiar:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>'
};
function ic(n,sz=20,fill=false){return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`}

/* Stage name em destaque: a.nome passa a ser o stage name; o nome pessoal fica em a.nomeReal */
function normAlunos(d){ (d&&d.alunos||[]).forEach(a=>{ if(a._n) return; a.nomeReal=a.nome||''; a.nome=a.stage||a.nome||'(sem nome)'; a._n=1; }); return d; }

/* ---------- comunicação com a folha ---------- */
async function api(acao, dados={}){
  if (DEMO) return demoApi(acao, dados);
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao,token:S.token,...dados}),redirect:'follow'});
  const j = await r.json();
  if (!j.ok){ if (j.erro==='SESSAO'){ sair(true); } throw new Error(j.erro||'Erro'); }
  return j;
}
async function carregar(silencioso){
  if(S.offline){ render(); return; }
  try{
    const j = await api('dados');
    S.d = normAlunos(j); S.eu = j.eu; lsSet('icy_dados', S.d); lsSet('icy_eu', j.eu);
    aplicarFilaLocal();
    render(); carregarFotos();
  }catch(e){ if(eRede(e)) sugerirOffline(); else if(!silencioso) toast(e.message); }
}
function eRede(e){return /rede|fetch|Failed|Load|network|NetworkError|Internet/i.test(String(e&&e.message||e))}
function novoTmp(p){return 'tmp'+p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function trocarId(a,b){
  const sub=o=>JSON.parse(JSON.stringify(o).split(a).join(b));
  S.fila=sub(S.fila); S.d=sub(S.d);
  lsSet('icy_fila',S.fila); lsSet('icy_dados',S.d);
}
function setOffline(v){
  S.offline=v; lsSet('icy_offline',v?'1':null); fecharSheet();
  if(v){ toast('Modo offline: as alterações ficam guardadas no telemóvel'); render(); }
  else { toast('De volta online: a enviar alterações…'); sincronizar(); carregar(true); }
}
let jaSugerido=false;
function sugerirOffline(){
  if(S.offline||jaSugerido) return; jaSugerido=true;
  abrirSheet(`<h4>Sem ligação</h4><p class="muted">Não foi possível falar com a folha. Em modo offline podem continuar a usar a app normalmente; tudo fica guardado no telemóvel e é enviado quando voltarem a ficar online.</p>
  <div class="list" style="margin-top:14px"><button class="btn pri full" data-a="offlineOn">Passar a modo offline</button><button class="btn full" data-a="fechar">Tentar mais tarde</button></div>`);
}
async function carregarFotos(){
  if(DEMO) return;
  // fotos guardadas pelo ficheiro do Drive: se o link mudar, a foto nova é descarregada
  const usados=new Set(S.d.alunos.map(a=>idFicheiro(a.foto)).filter(Boolean));
  Object.keys(S.fotos).forEach(k=>{if(!usados.has(k))delete S.fotos[k]}); lsSet('icy_fotos',S.fotos);
  const ids=S.d.alunos.filter(a=>a.foto&&/drive\.google|docs\.google/.test(a.foto)&&!S.fotos[idFicheiro(a.foto)]).map(a=>a.id);
  for(let i=0;i<ids.length;i+=6){
    try{ const j=await api('fotos',{ids:ids.slice(i,i+6)}); Object.entries(j.fotos||{}).forEach(([aid,img])=>{const k=idFicheiro(aluno(aid).foto);if(k)S.fotos[k]=img}); lsSet('icy_fotos',S.fotos); render(); }catch(e){ break; }
  }
}
/* Fila de alterações: guarda no telemóvel e envia quando houver rede. */
function enfileirar(acao,dados,chave,tmp){
  if(chave) S.fila = S.fila.filter(x=>x.chave!==chave);
  S.fila.push({acao,dados,chave,tmp,t:Date.now()}); lsSet('icy_fila',S.fila); sincronizar();
}
async function sincronizar(){
  if(S.offline||S.aSincronizar||!S.fila.length) { estadoSync(); return; }
  S.aSincronizar=true; estadoSync();
  try{
    while(S.fila.length){
      const op=S.fila[0];
      const j=await api(op.acao,op.dados);
      S.fila.shift(); lsSet('icy_fila',S.fila);
      if(op.tmp&&j&&j.id&&j.id!==op.tmp) trocarId(op.tmp,j.id);
    }
  }catch(e){ if(eRede(e)) sugerirOffline(); else { toast('Erro ao guardar: '+e.message); S.fila.shift(); lsSet('icy_fila',S.fila);} }
  S.aSincronizar=false; estadoSync();
  if(S.fila.length) setTimeout(sincronizar,8000);
}
function aplicarFilaLocal(){ /* as alterações pendentes já estão aplicadas aos dados locais quando foram feitas */
  S.fila.filter(op=>op.acao==='guardarPresencas').forEach(op=>aplicarPresencasLocal(op.dados));
}
function estadoSync(){const el=document.getElementById('sync');if(!el)return;if(S.offline){el.className='sync pend';el.textContent='Offline'+(S.fila.length?' · '+S.fila.length+' por enviar':'');return}if(S.fila.length){el.className='sync pend';el.textContent=S.aSincronizar?'A guardar…':'Por enviar ('+S.fila.length+')'}else{el.className='sync';el.textContent=DEMO?'':'Guardado'}}
window.addEventListener('online',sincronizar);
let ultimaCarga=Date.now();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.token&&!S.offline&&Date.now()-ultimaCarga>60000){ ultimaCarga=Date.now(); carregar(true); sincronizar(); } });

/* ---------- arranque ---------- */
function arrancar(){
  if (!S.token){ renderLogin(); return; }
  if (S.d) render(); else document.getElementById('app').innerHTML='<div class="spin"></div>';
  carregar(!!S.d); sincronizar();
}
function sair(expirou){ ['icy_token','icy_eu','icy_dados','icy_fila','icy_fotos'].forEach(k=>lsSet(k,null)); Object.assign(S,{token:null,eu:null,d:null,fila:[]}); renderLogin(expirou?'A sessão terminou. Entre outra vez.':''); }

function renderLogin(msg){
  document.getElementById('app').innerHTML = `
  <div class="login">
    <img src="${LOGO}" alt="ICY Academy">
    <form id="flog" autocomplete="on">

function proximosAniversarios(dias){
  const d=hoje(), y=Number(d.slice(0,4)); const out=[];
  (S.d.alunos||[]).filter(a=>a.ativo).forEach(a=>{const dm=diaMes(a); if(!dm) return; const [dd,mm]=dm.split('/');

/* ---------- PRESENÇAS ---------- */
function aulasDoDia(dia){
  const mes=dia.slice(0,7);
  const cal=S.d.calendario||[];
  const doDia=cal.filter(c=>c.data===dia);
  const minhas=new Set(minhasTurmas().map(t=>t.id));
  let aulas;
  if(doDia.length || cal.some(c=>c.data.slice(0,7)===mes)) aulas=doDia.map(c=>({...c}));
  else { const ds=DIAS[parse(dia).getDay()]; aulas=(S.d.turmas||[]).filter(t=>t.ativa&&t.dia===ds).map(t=>({data:dia,turma:t.id,inicio:t.inicio,fim:t.fim,local:t.local,tipo:'Normal'})); }
  (S.manuais||[]).filter(a=>a.data===dia&&!aulas.some(x=>x.turma===a.turma)).forEach(a=>aulas.push({...a}));
  // aulas extra que só existem nas presenças (ex.: marcadas sem calendário)
  (S.d.presencas||[]).filter(p=>p.data===dia).forEach(p=>{ if(!aulas.some(a=>a.turma===p.turma)) aulas.push({data:dia,turma:p.turma,inicio:'',fim:'',tipo:p.tipo||'Normal'}); });
  return aulas.filter(a=>gestao()||minhas.has(a.turma)).sort((a,b)=>(a.inicio||'').localeCompare(b.inicio||''));
}
function marcasDe(dia,tid){const m={};(S.d.presencas||[]).forEach(p=>{if(p.data===dia&&p.turma===tid)m[p.aluno]=p.estado||''});return m}
function aplicarPresencasLocal(op){
  S.d.presencas=(S.d.presencas||[]).filter(p=>!(p.data===op.data&&p.turma===op.turma&&op.marcas.some(m=>m.aluno===p.aluno)));
  op.marcas.forEach(m=>{ if(m.estado) S.d.presencas.push({data:op.data,turma:op.turma,aluno:m.aluno,estado:m.estado,tipo:op.tipo}); });
}
let tGuardar=null;
function marcar(dia,tid,tipo,alunoId,estado){
  aplicarPresencasLocal({data:dia,turma:tid,tipo,marcas:[{aluno:alunoId,estado}]});
  lsSet('icy_dados',S.d);
  clearTimeout(tGuardar);
  tGuardar=setTimeout(()=>{
    const marcas=Object.entries(marcasDe(dia,tid)).map(([aluno,estado])=>({aluno,estado}));
    // inclui os que ficaram "por marcar" para limpar na folha
    alunosVisiveisAula(dia,tid,tipo).forEach(a=>{if(!marcas.some(m=>m.aluno===a.id))marcas.push({aluno:a.id,estado:''})});
    enfileirar('guardarPresencas',{data:dia,turma:tid,tipo,marcas},'pres|'+dia+'|'+tid);
  },900);
}
function alunosVisiveisAula(dia,tid,tipo){
  const base=alunosDaTurma(tid);
  const marcados=Object.keys(marcasDe(dia,tid)).map(aluno).filter(a=>a.id);
  const extra=(S.extraRep&&S.extraRep[dia+'|'+tid])||[];
  const todos=[...base];
  [...marcados,...extra.map(aluno)].forEach(a=>{if(!todos.some(x=>x.id===a.id))todos.push(a)});
  return todos;
}
function turmasCover(c){return String(c.turma||'').split(/[,;]\s*/).map(x=>x.trim()).filter(Boolean)}
function nomesTurmasCover(c){return turmasCover(c).map(x=>turma(x).nome).join(' + ')}
function alunosDoCover(c){const out=[];turmasCover(c).forEach(t=>alunosDaTurma(t).forEach(a=>{if(!out.some(x=>x.id===a.id))out.push(a)}));return out.sort((a,b)=>a.nome.localeCompare(b.nome,'pt'))}

/* ---------- CALENDÁRIO ---------- */
function aulasDoMes(m){
  if(!S.calDraft||S.calDraft.mes!==m||!S.calDirty) S.calDraft={mes:m,aulas:ordenar((S.d.calendario||[]).filter(c=>c.data.slice(0,7)===m).map(c=>({...c})))};
  return S.calDraft.aulas;
}
function gerarMes(m){
  const [y,mm]=m.split('-').map(Number); const out=[];
  for(let d=1;d<=31;d++){const dt=new Date(y,mm-1,d,12);if(dt.getMonth()!==mm-1)break;const ds=DIAS[dt.getDay()];
    (S.d.turmas||[]).filter(t=>t.ativa&&t.dia===ds).forEach(t=>out.push({data:iso(dt),turma:t.id,inicio:t.inicio,fim:t.fim,local:t.local,tipo:'Normal',notas:''}));}
  return out;
}
function ordenar(as){return as.sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio))}
VISTAS.cal = () => {
  const m=S.mesCal; const as=aulasDoMes(m);
  const minhas=new Set(minhasTurmas().map(t=>t.id));
  const vis=gestao()?as:as.filter(a=>minhas.has(a.turma));
  let h=`<h2 class="sec">Calendário</h2>
  <div class="datebar"><button class="icobtn" data-a="mesCal" data-n="-1">${ic('left',18)}</button><div class="d">${mesPT(m)}</div><button class="icobtn" data-a="mesCal" data-n="1">${ic('right',18)}</button></div>`;
  if(S.calDirty) h+=`<div class="card small" style="border-color:var(--just);margin-bottom:10px">Há alterações por guardar neste mês.<div class="row" style="margin-top:8px;gap:8px"><button class="btn pri sm" data-a="guardarMes">Guardar mês</button><button class="btn sm" data-a="descartarMes">Descartar</button></div></div>`;
  if(!vis.length){
    h+=`<div class="card empty"><div class="gotico">Mês por planear</div><p>${gestao()?'Gerem as aulas a partir do horário habitual e depois ajustem o que for preciso.':'A gestão ainda não planeou este mês.'}</p>${gestao()?`<button class="btn pri" data-a="gerarMes">Gerar a partir do horário</button>`:''}</div>`;
  } else {
    let ult='';
    vis.forEach((a,i)=>{ if(a.data!==ult){ if(ult) h+='</div>'; h+=`<div class="cal-day"><div class="dt">${diaPT(a.data)}</div>`; ult=a.data; }
      const t=turma(a.turma);
      h+=`<div class="aula ${a.tipo==='Cancelada'?'cancel':''}" data-a="editAula" data-i="${as.indexOf(a)}"><span class="h">${esc(a.inicio||'')}${a.fim?'–'+esc(a.fim):''}</span><span style="flex:1">${esc(t.nome)}</span>${a.tipo!=='Normal'?`<span class="badge ${a.tipo==='Reposição'?'rep':'bad'}">${esc(a.tipo)}</span>`:''}</div>`;
    }); h+='</div>';
  }
  h+=`<div class="list" style="margin-top:16px">
    <button class="btn full" data-a="novaRep">${ic('plus',18)} Nova reposição</button>
    ${gestao()&&vis.length?`<button class="btn full" data-a="novaAulaCal">${ic('plus',18)} Acrescentar aula</button>`:''}
    ${vis.length?`<button class="btn wa full" data-a="waPlano">${ic('wa',18)} Enviar planeamento no WhatsApp</button>`:''}
  </div>`;
  return h;

function msgReposicao(a){

function msgPlano(m){
  const as=ordenar(aulasDoMes(m));

function esperadoMes(aid,m){

  turmasDoAluno(aid).forEach(i=>{const t=turma(i.turma);

    else{total+=t.mensalidade||0;linhas.push(`${t.nome}: mensalidade ${eur(t.mensalidade||0)}`)}
  });

}
function estadoPagamento(aid,m){

  if(e<=0&&pago<=0) return {esperado:0,pago,cls:'',txt:'Sem valor'};

}

/* ---------- Urban Xpression (aluguer do espaço) ---------- */
const URBAN='Urban Xpression';
function precoHora(){return (S.d.espaco&&S.d.espaco.precoHora)||15}
function urbanDesde(){return (S.d.espaco&&S.d.espaco.desde)||'2026-11'}
function horasEntre(i,f){const a=String(i||'').split(':'),b=String(f||'').split(':');const h=(Number(b[0])*60+Number(b[1]||0)-Number(a[0])*60-Number(a[1]||0))/60;return h>0?h:0}
function fmtH(h){return String(Math.round(h*100)/100).replace('.',',')+' h'}
/* Aulas no espaço num mês: as que tiveram presenças marcadas e as do calendário que não foram canceladas. */
function sessoesUrban(m){
  const ses={}, hj=hoje();
  if(m<urbanDesde()) return [];
  // Horário fixo: cada turma ativa conta em todos os seus dias da semana do mês (exceto aulas canceladas no calendário)
  const canc=new Set((S.d.calendario||[]).filter(c=>c.tipo==='Cancelada').map(c=>c.data+'|'+c.turma));
  const ini=parse(m+'-01');
  (S.d.turmas||[]).filter(t=>t.ativa!==false).forEach(t=>{const wd=DIAS.findIndex(x=>x.toLowerCase()===String(t.dia||'').toLowerCase().trim());if(wd<0)return;
    const d=new Date(ini);while(d.getMonth()===ini.getMonth()){if(d.getDay()===wd){const ds=iso(d);if(!canc.has(ds+'|'+t.id))ses[ds+'|'+t.id+'|Normal']={data:ds,turma:t.id,tipo:'Normal'}}d.setDate(d.getDate()+1)}});
  (S.d.presencas||[]).filter(p=>p.data.slice(0,7)===m).forEach(p=>{const k=p.data+'|'+p.turma+'|'+(p.tipo||'Normal');ses[k]=ses[k]||{data:p.data,turma:p.turma,tipo:p.tipo||'Normal'}});
  (S.d.calendario||[]).filter(c=>String(c.data).slice(0,7)===m&&c.tipo!=='Cancelada').forEach(c=>{const k=c.data+'|'+c.turma+'|'+(c.tipo||'Normal');ses[k]=Object.assign(ses[k]||{},{data:c.data,turma:c.turma,tipo:c.tipo||'Normal',inicio:c.inicio,fim:c.fim})});
  const dias={};
  Object.values(ses).forEach(x=>{const t=turma(x.turma)||{};const h=horasEntre(x.inicio||t.inicio,x.fim||t.fim);if(!h)return;
    const d=dias[x.data]=dias[x.data]||{data:x.data,horas:0,turmas:[],futura:x.data>hj};d.horas+=h;d.turmas.push((t.nome||x.turma)+(x.tipo&&x.tipo!=='Normal'?' ('+x.tipo.toLowerCase()+')':''))});
  return Object.values(dias).sort((a,b)=>a.data.localeCompare(b.data));
}
function contaUrban(m){
  const dias=sessoesUrban(m), ph=precoHora();
  const dadas=dias.filter(d=>!d.futura), prev=dias.filter(d=>d.futura);
  const horas=dadas.reduce((s,d)=>s+d.horas,0), horasPrev=prev.reduce((s,d)=>s+d.horas,0);
  const pg=(S.d.pagEspaco||[]).filter(p=>p.mes===m), pago=pg.reduce((s,p)=>s+(p.valor||0),0);
  const devido=horas*ph, total=(horas+horasPrev)*ph, aDecorrer=m>=hoje().slice(0,7)&&prev.length>0;
  let est;
  if(pago>0&&pago>=total-0.005) est={cls:'ok',txt:'Pago'};
  else if(pago>0) est={cls:'warn',txt:'Falta '+eur(total-pago)};
  else if(!total) est={cls:'',txt:'Sem aulas'};
  else if(aDecorrer||m===hoje().slice(0,7)) est={cls:'',txt:'Mês a decorrer'};
  else est={cls:'bad',txt:'Por pagar'};
  return {dias,dadas,prev,horas,horasPrev,devido,total,pago,pg,est,ph};
}
function urbanEmDivida(){
  const out=[]; const atual=hoje().slice(0,7);
  for(let i=1;i<=24;i++){const m=addMes(atual,-i);if(m<urbanDesde())break;const c=contaUrban(m);if(c.total>0&&c.pago<c.total-0.005)out.push({m,falta:c.total-c.pago})}
  return out;
}
function vistaUrban(m){
  const c=contaUrban(m);
  const divida=urbanEmDivida().filter(x=>x.m!==m);
  let h=`<div class="hero" style="margin-top:12px"><div class="k">Aluguer do espaço · ${mesPT(m)}</div>
    <div class="nm">${eur(c.total).replace(',00','')}</div>
    <div class="sub">${c.dias.length} dia${c.dias.length===1?'':'s'} de aula · ${fmtH(c.horas+c.horasPrev)} × ${eur(c.ph).replace(',00','')}/h${c.prev.length?` · ${c.prev.length} ainda por dar`:''}</div>
    <div class="sub" style="opacity:.75;font-size:12px;margin-top:2px">Pago no fim do mês</div>

function abrirSheet(html){ fecharSheet(); const bg=document.createElement('div'); bg.className='sheet-bg';

/* Arrastar a janela para baixo fecha-a, como no iPhone. */
function arrastarParaFechar(bg, sh){
  let y0=null, dy=0, desdeTopo=false;
  sh.addEventListener('touchstart',e=>{ const t=e.touches[0]; const naPega=e.target.closest('.sheet-top'); desdeTopo=!!naPega||sh.scrollTop<=0; if(!desdeTopo){y0=null;return} if(!naPega&&e.target.closest('input,textarea,select'))return; y0=t.clientY; dy=0; sh.style.transition='none'; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0==null)return; dy=e.touches[0].clientY-y0; if(dy>0&&(sh.scrollTop<=0||e.target.closest('.sheet-top'))){ sh.style.transform=`translateY(${dy}px)`; bg.style.background=`rgba(0,0,10,${Math.max(0,.6-dy/600)})`; if(e.cancelable)e.preventDefault(); } },{passive:false});
  sh.addEventListener('touchend',()=>{ if(y0==null)return; sh.style.transition='transform .22s ease-out'; if(dy>110){ sh.style.transform='translateY(100%)'; setTimeout(fecharSheet,200); } else { sh.style.transform=''; bg.style.background=''; } y0=null; });
}
